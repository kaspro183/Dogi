# Every 5 minutes, asks the site's hidden bot function to post new DOGI buys to Telegram.
# The key lives in the repo secret DOGI_CRON_KEY (same value as CRON_SECRET in Netlify).
name: DOGI buy alerts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Doggy Market for new buys
        run: curl -sS --max-time 90 "https://dogidrc20.org/api/tg-buys?key=${{ secrets.DOGI_CRON_KEY }}" || true
